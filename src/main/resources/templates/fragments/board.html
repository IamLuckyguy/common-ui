<!-- fragments/board.html -->
<section th:fragment="board" class="board-section">
    <div class="board-container">
        <!-- 탭 네비게이션 -->
        <nav class="board-tabs">
            <button class="tab-item active" data-tab="all">전체</button>
            <button class="tab-item" data-tab="exchange">환율</button>
            <button class="tab-item" data-tab="feedback">참견</button>
            <button class="tab-item" data-tab="notice">공지</button>
        </nav>

        <!-- 게시글 목록 -->
        <div class="post-list">
            <!-- 게시글 아이템 -->
            <article class="post-item">
                <div class="post-header">
                    <div class="post-author">
                        <div class="author-avatar">
                            <img src="/img/yoon.jpg" alt="프로필 이미지">
                        </div>
                        <div class="author-info">
                            <span class="author-name">윤코딩</span>
                            <span class="post-date">2024.02.08 14:30</span>
                        </div>
                    </div>
                </div>
                <div class="post-content">
                    <div class="post-text clamp">
                        여기에 게시글 내용이 들어갑니다. 이 내용은 기본적으로 4줄까지만 표시되며,
                        더 긴 내용은 '더보기'를 통해 확인할 수 있습니다. 모바일에서도 동일하게
                        적용되며, 반응형으로 구현됩니다. 게시글에는 좋아요와 댓글 기능이
                        포함되어 있습니다.
                    </div>
                    <button class="btn-more">더보기</button>
                </div>
                <div class="post-footer">
                    <div class="post-actions">
                        <button class="btn-like">
                            <span class="like-icon">♡</span>
                            <span class="like-count">3522</span>
                        </button>
                        <button class="btn-comment">
                            <span class="comment-icon">💬</span>
                            <span class="comment-count">450</span>
                        </button>
                    </div>
                </div>

                <!-- 댓글 영역 -->
                <div class="comments-section">
                    <div class="comment-write">
                        <div class="comment-avatar">
                            <img src="/img/yoon.jpg" alt="내 프로필">
                        </div>
                        <form class="comment-form">
                            <input type="text" placeholder="답글을 입력하세요..." class="comment-input">
                            <button type="submit" class="btn-submit">작성</button>
                        </form>
                    </div>
                </div>
            </article>
        </div>
    </div>

    <!-- 하단 고정 게시글 작성 영역 -->
    <div class="bottom-write-bar">
        <div class="bottom-write-container">
            <div class="writer-profile">
                <div class="writer-avatar">
                    <img src="/api/placeholder/32/32" alt="내 프로필">
                </div>
            </div>
            <div class="write-input-wrapper">
                <textarea class="write-input" placeholder="윤코딩님의 생각을 적어주세요..." rows="1"></textarea>
                <button class="btn-submit-post" disabled>게시</button>
            </div>
        </div>
    </div>
</section>
