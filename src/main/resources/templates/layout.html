<!-- common-ui/resources/templates/layout.html -->
<!DOCTYPE html>
<html th:fragment="layout(title, content, meta, css, scripts)" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- GTM Head -->
    <th:block th:replace="~{fragments/gtm :: head}" />

    <!-- 메타 태그(서비스별 생성 필요) -->
    <th:block th:if="${meta}" th:replace="${meta}" />

    <title th:replace="${title}">Default Title</title>

    <!-- 공통 CSS -->
    <!-- base -->
    <link rel="stylesheet" th:href="@{/css/base/_variables.css}">
    <link rel="stylesheet" th:href="@{/css/base/_reset.css}">
    <link rel="stylesheet" th:href="@{/css/base/_animations.css}">

    <!-- components 추가할 경우 순서에 따라 동작이 달라질 수 있음을 유의 -->
    <link rel="stylesheet" th:href="@{/css/components/_layouts.css}">
    <link rel="stylesheet" th:href="@{/css/components/_forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/_buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/_modal.css}">
    <link rel="stylesheet" th:href="@{/css/components/_header.css}">
    <link rel="stylesheet" th:href="@{/css/components/_board.css}">
    <link rel="stylesheet" th:href="@{/css/components/_loading.css}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- 서비스별 테마 설정 -->
    <style th:inline="css">
        :root {
            --theme-color: [(${@serviceProperties.themeColor})];
            --theme-color-rgb: [(${@serviceProperties.themeColorRgb})];
        }
    </style>

    <!-- Favicons (서비스별 생성 필요) -->
    <th:block th:replace="~{fragments/favicon :: favicons}" />

    <!-- 각 서비스 페이지에서 추가하는 CSS -->
    <th:block th:insert="${css}" />

    <!-- 공통 스크립트 -->
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/board.js}"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Google AdSense -->
    <script th:if="${activeProfile == 'prod'}"
            async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1089551323467984"
            crossorigin="anonymous">
    </script>
</head>
<body th:class="dark">
    <!-- GTM Body -->
    <th:block th:replace="~{fragments/gtm :: body}" />

    <!-- Loading Overlay -->
    <th:block th:replace="~{fragments/loading :: loading-overlay}" />

    <div class="app-wrapper">
        <!-- Header -->
        <th:block th:replace="~{fragments/header :: header(services=${services}, currentService=${@serviceProperties})}" />

        <!-- Main Content Area -->
        <div class="main-content-wrapper">
            <!-- 환율계산기, 연봉실수령좀 등의 서비스 내용 -->
            <div class="main-content">
                <th:block th:replace="${content}" />
            </div>

            <!-- Board -->
            <div class="board-content">
                <th:block th:replace="~{fragments/board :: board}" />
            </div>
        </div>

        <!-- Footer -->
        <th:block th:replace="~{fragments/footer :: footer}" />
    </div>

    <!-- 로그인 모달 -->
    <th:block th:replace="~{fragments/login-modal :: loginModal}"></th:block>

    <!-- 각 서비스 페이지에서 추가하는 스크립트 -->
    <th:block th:replace="${scripts}" />
</body>
</html>
